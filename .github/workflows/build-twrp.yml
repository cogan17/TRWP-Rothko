name: Build TWRP (rothko)

on:
  workflow_dispatch:
  push:
    branches: [twrp-14.1_a16]
    paths: ['.github/workflows/build-twrp.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Source + out/ need ~80 GB; merge the runner's free root and /mnt space into the workspace
      - uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build tools
        run: |
          # runner apt mirrors flake now and then
          for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update && break; sleep 15; done
          sudo apt-get -o Acquire::Retries=3 install -y bc bison build-essential curl flex git gnupg gperf libssl-dev \
            libxml2-utils lz4 python-is-python3 rsync unzip xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          df -h

      - name: Sync TWRP 14.1 minimal manifest
        run: |
          mkdir twrp && cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          df -h .

      - uses: actions/checkout@v4
        with:
          path: twrp/device/xiaomi/rothko

      - name: Build vendor_boot.img
        run: |
          cd twrp
          {
            export ALLOW_MISSING_DEPENDENCIES=true
            source build/envsetup.sh
            # 14.1 lunch requires <product>-<release>-<variant>
            lunch twrp_rothko-ap2a-eng || lunch twrp_rothko-trunk_staging-eng
            mka vendorbootimage
          } 2>&1 | tee build.log
          cd out/target/product/rothko
          sha256sum vendor_boot.img | tee vendor_boot.img.sha256
          echo "::notice title=vendor_boot.img::$(stat -c%s vendor_boot.img) bytes, sha256 $(cut -d' ' -f1 vendor_boot.img.sha256)"

      # Surface the compiler error as an annotation so it is readable without downloading logs
      - name: Report build error
        if: failure()
        run: |
          f=twrp/out/error.log
          [ -s "$f" ] || f=twrp/build.log
          [ -s "$f" ] || exit 0
          msg=$(tail -c 3500 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build error::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: twrp-rothko-vendor_boot-${{ github.run_number }}
          path: |
            twrp/out/target/product/rothko/vendor_boot.img
            twrp/out/target/product/rothko/vendor_boot.img.sha256
