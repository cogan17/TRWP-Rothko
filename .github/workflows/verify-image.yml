name: Verify TWRP image (rothko)

# Pre-flash gate: compares a built TWRP vendor_boot.img with the stock one (both
# from artifacts, no source sync). Only an image that passes is packaged for users.
on:
  workflow_run:
    workflows: ['Build TWRP (rothko)']
    types: [completed]
  workflow_dispatch:
    inputs:
      twrp_run_id:
        description: 'Run id of the "Build TWRP" run'
      stock_run_id:
        description: 'Run id of the "Extract stock blobs" run'

permissions:
  actions: read

env:
  TWRP_RUN: ${{ github.event.workflow_run.id || inputs.twrp_run_id }}
  STOCK_RUN: ${{ inputs.stock_run_id || '39179296762' }}
  VERSION: OS3.0.301.0.WNNIDXM

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/download-artifact@v4
        with:
          pattern: twrp-rothko-vendor_boot-*
          path: twrp
          merge-multiple: true
          run-id: ${{ env.TWRP_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: stock-images-*
          path: stock
          merge-multiple: true
          run-id: ${{ env.STOCK_RUN }}
          github-token: ${{ github.token }}

      - name: Unpack both images
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y lz4 zstd cpio >/dev/null
          git clone -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg ~/mkbootimg
          git clone -q --depth 1 https://android.googlesource.com/platform/external/avb ~/avb
          (cd twrp && sha256sum -c vendor_boot.img.sha256)
          # Stock keeps recovery in its own fragment (type RECOVERY, name "recovery") that the
          # bootloader adds only in recovery mode. TWRP built as one platform fragment boots Android
          # but never reached the kernel in recovery mode, so split it the same way: normal boot
          # gets lib/ and first_stage_ramdisk/, recovery mode gets both (= the original content).
          python3 ~/mkbootimg/unpack_bootimg.py --boot_img twrp/vendor_boot.img --out u-orig --format=mkbootimg -0 > orig.args
          [ "$(ls u-orig | grep vendor_ramdisk)" = vendor_ramdisk00 ]
          zstd -dc u-orig/vendor_ramdisk00 > all.cpio
          python3 - <<'EOF'
          d = open('all.cpio', 'rb').read()
          out = {'platform': bytearray(), 'recovery': bytearray()}
          pos = 0
          while True:
              h = d[pos:pos + 110]
              assert h[:6] == b'070701', pos  # newc, as written by mkbootfs
              namesize, filesize = int(h[94:102], 16), int(h[54:62], 16)
              name = d[pos + 110:pos + 109 + namesize].decode()
              end = pos + ((110 + namesize + 3) & ~3) + ((filesize + 3) & ~3)
              if name == 'TRAILER!!!':
                  break
              out['platform' if name.split('/')[0] in ('lib', 'first_stage_ramdisk') else 'recovery'] += d[pos:end]
              pos = end
          assert not d[end:].strip(b'\0')
          for k, o in out.items():
              open(k + '.cpio', 'wb').write(o + d[pos:end])
          EOF
          for f in platform recovery; do zstd -19 -T0 -q -c $f.cpio > $f.cpio.zst; done
          mapfile -d '' a < orig.args
          for i in "${!a[@]}"; do [ "${a[i]}" = --ramdisk_type ] && break; done
          python3 ~/mkbootimg/mkbootimg.py "${a[@]:0:i}" \
            --ramdisk_type platform --ramdisk_name '' --vendor_ramdisk_fragment platform.cpio.zst \
            --ramdisk_type recovery --ramdisk_name recovery --vendor_ramdisk_fragment recovery.cpio.zst \
            --vendor_boot split.img
          # keep the AVB hash footer the build added
          if python3 ~/avb/avbtool.py info_image --image twrp/vendor_boot.img >/dev/null 2>&1; then
            python3 ~/avb/avbtool.py add_hash_footer --image split.img --partition_name vendor_boot \
              --partition_size $(stat -c%s twrp/vendor_boot.img)
          fi
          mv split.img twrp/vendor_boot.img
          unpack() {
            case "$(head -c4 "$1" | od -An -tx1 | tr -d ' ')" in
              02214c18) lz4 -dc "$1" ;;
              28b52ffd) zstd -dc "$1" ;;
              1f8b*) gzip -dc "$1" ;;
              *) cat "$1" ;;
            esac | (mkdir -p "$2" && cd "$2" && cpio -idm --quiet --no-absolute-filenames)
          }
          for n in twrp stock; do
            python3 ~/mkbootimg/unpack_bootimg.py --boot_img $n/vendor_boot.img --out u-$n > $n.txt
            for f in u-$n/vendor_ramdisk*; do
              unpack "$f" r-$n                        # all fragments merged
              unpack "$f" frag-$n-$(basename "$f")    # each fragment alone
            done
          done

      - name: Layout report
        run: |
          for n in twrp stock; do
            echo "::notice title=$n header::$(grep -vE '^ +board_id|^ +0x' $n.txt | tr -s ' ' | tr '\n' ';')"
            for d in frag-$n-*; do
              has() { [ -e "$d/$1" ] && echo y || echo n; }
              echo "::notice title=$d::$(find "$d" -type f | wc -l) files; recovery=$(has system/bin/recovery) twres=$(has twres) fstab=$(has first_stage_ramdisk/fstab.mt6989) modules.load=$(has lib/modules/modules.load)"
            done
          done
          echo "::notice title=TWRP ramdisk biggest files (KB)::$(find r-twrp -type f -printf '%k %P\n' | sort -rn | head -30 | tr '\n' ';')"

      - name: Gate
        run: |
          bad=0
          check() { if eval "$2"; then echo "::notice title=OK::$1"; else echo "::error title=FAIL::$1"; bad=1; fi; }
          tw=$(grep -A3 'vendor_ramdisk00: {' twrp.txt | grep -m1 'size:' | grep -o '[0-9]*$')
          st=$(grep -A3 'vendor_ramdisk00: {' stock.txt | grep -m1 'size:' | grep -o '[0-9]*$')
          # stock normal boot loads only its 41 MB platform fragment
          check "TWRP normal-boot fragment $tw bytes <= stock $st bytes" '[ "$tw" -le "$st" ]'
          lay() { grep -E '^ +(type|name):' $1.txt | tr -d ' \n'; }
          check "fragment layout matches stock: $(lay stock)" '[ "$(lay twrp)" = "$(lay stock)" ]'
          check "image fits the vendor_boot partition" '[ $(stat -c%s twrp/vendor_boot.img) -le $(stat -c%s stock/vendor_boot.img) ]'
          check "ramdisk is zstd" '[ "$(head -c4 u-twrp/vendor_ramdisk00 | od -An -tx1 | tr -d " ")" = 28b52ffd ]'
          check "dtb identical to stock" 'cmp -s u-twrp/dtb u-stock/dtb'
          check "TWRP UI in recovery fragment (twres/, system/bin/recovery)" '[ -d frag-twrp-vendor_ramdisk01/twres ] && [ -e frag-twrp-vendor_ramdisk01/system/bin/recovery ]'
          check "twrp.flags present" '[ -f r-twrp/system/etc/twrp.flags ]'
          # Android's normal boot reads these from the platform fragment, so they must equal stock
          check "first-stage fstab matches stock" 'cmp -s frag-twrp-vendor_ramdisk00/first_stage_ramdisk/fstab.mt6989 frag-stock-vendor_ramdisk00/first_stage_ramdisk/fstab.mt6989'
          d=$(diff -rq frag-twrp-vendor_ramdisk00/lib/modules frag-stock-vendor_ramdisk00/lib/modules || true)
          check "lib/modules identical to stock ($(ls r-stock/lib/modules | wc -l) files)" '[ -z "$d" ]'
          [ -z "$d" ] || echo "::warning title=modules diff::$(echo "$d" | head -20 | tr '\n' ';')"
          exit $bad

      - name: Package for end users
        run: |
          t=TWRP-rothko-$VERSION.img; s=STOK-vendor_boot-$VERSION.img
          mkdir dist
          cp twrp/vendor_boot.img dist/$t
          cp stock/vendor_boot.img dist/$s
          ts=$(sha256sum dist/$t | cut -d' ' -f1); ss=$(sha256sum dist/$s | cut -d' ' -f1)
          for f in repo/release/*; do
            # Windows scripts and notes: fill in names and hashes, CRLF line endings
            sed -e "s/@VERSION@/$VERSION/g" -e "s/@TWRP_IMG@/$t/g" -e "s/@TWRP_SHA256@/$ts/g" \
                -e "s/@STOCK_IMG@/$s/g" -e "s/@STOCK_SHA256@/$ss/g" -e 's/$/\r/' "$f" > "dist/$(basename "$f")"
          done
          ! grep -l '@[A-Z0-9_]*@' dist/*.bat dist/*.txt
          echo "::notice title=Paket siap::$t sha256 $ts; $s sha256 $ss"

      - uses: actions/upload-artifact@v4
        with:
          name: PAKET-TWRP-rothko-${{ env.VERSION }}
          path: dist/
