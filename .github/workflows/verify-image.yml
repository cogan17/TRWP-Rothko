name: Verify TWRP image (rothko)

# Cheap pre-flash check: compares a built TWRP vendor_boot.img with the stock one
# (both taken from existing artifacts, no source sync) before anyone flashes it.
on:
  workflow_dispatch:
    inputs:
      twrp_run_id:
        description: 'Run id of the "Build TWRP" run'
      stock_run_id:
        description: 'Run id of the "Extract stock blobs" run'
  push:
    branches: [twrp-14.1_a16]
    paths: ['.github/workflows/verify-image.yml']

permissions:
  actions: read

env:
  TWRP_RUN: ${{ inputs.twrp_run_id || '39191260842' }}
  STOCK_RUN: ${{ inputs.stock_run_id || '39179296762' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twrp-rothko-vendor_boot-*
          path: twrp
          merge-multiple: true
          run-id: ${{ env.TWRP_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: stock-images-*
          path: stock
          merge-multiple: true
          run-id: ${{ env.STOCK_RUN }}
          github-token: ${{ github.token }}

      - name: Unpack both images
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y lz4 cpio >/dev/null
          git clone -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg ~/mkbootimg
          (cd twrp && sha256sum -c vendor_boot.img.sha256)
          for n in twrp stock; do
            python3 ~/mkbootimg/unpack_bootimg.py --boot_img $n/vendor_boot.img --out u-$n > $n.txt
            mkdir -p r-$n
            for f in u-$n/vendor_ramdisk*; do
              case "$(head -c4 "$f" | od -An -tx1 | tr -d ' ')" in
                02214c18) lz4 -dc "$f" ;;
                1f8b*) gzip -dc "$f" ;;
                *) cat "$f" ;;
              esac | (cd r-$n && cpio -idm --quiet --no-absolute-filenames)
            done
          done

      # TWRP bootlooped while stock has two fragments (TWRP one): show what each fragment holds
      - name: Per-fragment layout
        run: |
          for n in twrp stock; do
            echo "::notice title=$n ramdisk table::$(grep -E 'vendor_ramdisk[0-9]|^ +(size|offset|type|name):' $n.txt | tr -s ' ' | tr '\n' ';')"
            for f in u-$n/vendor_ramdisk*; do
              d=frag-$n-$(basename "$f"); mkdir -p "$d"
              case "$(head -c4 "$f" | od -An -tx1 | tr -d ' ')" in
                02214c18) lz4 -dc "$f" ;;
                1f8b*) gzip -dc "$f" ;;
                *) cat "$f" ;;
              esac | (cd "$d" && cpio -idm --quiet --no-absolute-filenames)
              has() { [ -e "$d/$1" ] && echo y || echo n; }
              echo "::notice title=$n $(basename "$f")::$(stat -c%s "$f") bytes, $(find "$d" -type f | wc -l) files; system/bin/recovery=$(has system/bin/recovery) twres=$(has twres) init.recovery.mt6989.rc=$(has init.recovery.mt6989.rc) first_stage_ramdisk/fstab=$(has first_stage_ramdisk/fstab.mt6989) modules.load=$(has lib/modules/modules.load) modules.load.recovery=$(has lib/modules/modules.load.recovery) ko=$(ls "$d"/lib/modules 2>/dev/null | grep -c '\.ko$' || true); top: $(ls "$d" | tr '\n' ' ')"
            done
          done

      - name: Full headers and bootconfig
        run: |
          for n in twrp stock; do
            echo "::notice title=$n full header::$(grep -vE '^ +board_id|^ +0x' $n.txt | tr -s ' ' | tr '\n' ';')"
            if [ -s u-$n/bootconfig ]; then
              echo "::notice title=$n bootconfig::$(tr '\n' ';' < u-$n/bootconfig)"
            else
              echo "::notice title=$n bootconfig::(none)"
            fi
          done

      - name: Normal-boot files and size breakdown
        run: |
          lst() { (cd "$1" && find . -type f -o -type l | sed 's|^\./||' | sort); }
          echo "::notice title=stock first_stage_ramdisk::$(lst frag-stock-vendor_ramdisk00/first_stage_ramdisk | tr '\n' ' ')"
          echo "::notice title=twrp first_stage_ramdisk::$(lst frag-twrp-vendor_ramdisk00/first_stage_ramdisk | tr '\n' ' ')"
          echo "::notice title=In stock platform fragment, missing from TWRP::$(comm -23 <(lst frag-stock-vendor_ramdisk00) <(lst frag-twrp-vendor_ramdisk00) | head -150 | tr '\n' ' ')"
          echo "::notice title=TWRP ramdisk biggest dirs (uncompressed KB)::$(du -k --max-depth=3 frag-twrp-vendor_ramdisk00 | sort -rn | sed -n '2,40p' | sed 's|frag-twrp-vendor_ramdisk00/||' | tr '\t\n' ' ;')"
          echo "::notice title=TWRP ramdisk biggest files (KB)::$(find frag-twrp-vendor_ramdisk00 -type f -printf '%k %P\n' | sort -rn | head -40 | tr '\n' ';')"

      - name: Compare
        run: |
          hdr() { grep -iE 'header version|page size|address|command line|dtb size|ramdisk total size|vendor_ramdisk0' "$1" | tr '\n' ';'; }
          echo "::notice title=TWRP header::$(hdr twrp.txt)"
          echo "::notice title=Stock header::$(hdr stock.txt)"
          bad=0
          check() { if eval "$2"; then echo "::notice title=OK::$1"; else echo "::error title=FAIL::$1"; bad=1; fi; }
          check "dtb identical to stock" 'cmp -s u-twrp/dtb u-stock/dtb'
          check "TWRP UI present (twres/, system/bin/recovery)" '[ -d r-twrp/twres ] && [ -e r-twrp/system/bin/recovery ]'
          check "twrp.flags present" '[ -f r-twrp/system/etc/twrp.flags ]'
          check "first-stage fstab matches stock" 'cmp -s r-twrp/first_stage_ramdisk/fstab.mt6989 r-stock/first_stage_ramdisk/fstab.mt6989'
          # Android's normal boot loads these from vendor_boot too, so they must equal stock
          d=$(diff -rq r-twrp/lib/modules r-stock/lib/modules || true)
          check "lib/modules identical to stock ($(ls r-stock/lib/modules | wc -l) files)" '[ -z "$d" ]'
          [ -z "$d" ] || echo "::warning title=modules diff::$(echo "$d" | head -20 | tr '\n' ';')"
          echo "::notice title=Stock-only top-level ramdisk entries::$(comm -13 <(ls r-twrp) <(ls r-stock) | tr '\n' ' ')"
          exit $bad
