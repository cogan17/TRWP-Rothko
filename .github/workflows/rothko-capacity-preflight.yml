name: Rothko Runner Capacity Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect runner capacity (no checkout or build)
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          total, used, free = shutil.disk_usage('/')
          gib = 1024 ** 3
          lower_bound = 36461932679
          print(f"Disk total={total/gib:.2f} GiB free={free/gib:.2f} GiB")
          print(f"Three-prebuilt raw lower bound={lower_bound/gib:.2f} GiB")
          if free <= lower_bound:
              print("HOLD: runner insufficient even for raw prebuilt lower bound")
          else:
              print("HOLD: lower bound met; complete checkout/build capacity remains unverified")
          PY
